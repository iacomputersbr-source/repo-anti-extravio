name: Descomprimir
on: [push]
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: unzip -o *.zip
      - run: |
          rm -f *.zip
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add.
          git commit -m "descomprimido" || true
          git push
